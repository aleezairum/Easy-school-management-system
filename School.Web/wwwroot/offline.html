<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006d3b" />
    <title>No internet - EasySchool</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; background: #f8fafc; color: #1e293b; }
        .box { text-align: center; padding: 32px 24px; max-width: 360px; }
        img { width: 88px; height: 88px; border-radius: 20px; }
        h1 { font-size: 20px; margin: 18px 0 8px; }
        p { color: #64748b; font-size: 15px; line-height: 1.5; margin: 0 0 22px; }
        button { background: #006d3b; color: #fff; border: none; border-radius: 10px; padding: 12px 26px; font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/EasySchool/images/pwa-192.png" alt="" />
        <h1>No internet connection</h1>
        <p>EasySchool needs the internet to show the school's latest records. Check Wi-Fi or mobile data, then try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
